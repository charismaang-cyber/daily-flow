# 시세·이슈를 30분마다 받고(레이더는 3시간마다) gh-pages 가지에 화면+자료를 새로 올린다.
# gh-pages 는 매번 옛 기록 없이 덮어써서(force push) 저장소가 커지지 않는다. 레이더 기록은 그 안 radar/state.json 에 이어 쌓인다.
# 깃허브 무료 예약(cron)은 몇 시간씩 건너뛰기도 해서, 한 번 실행되면 그 안에서 5시간 반 동안 스스로 30분마다 돈다.
# 새 실행이 오면 돌던 것을 멈추고 이어받는다(자료는 회차마다 gh-pages 에 올라가 있어 잃지 않음).
name: collect

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: 지난 자료 가져오기
        uses: actions/checkout@v4
        continue-on-error: true  # 첫 실행엔 gh-pages 가 없다
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 30분마다 받고 올리기 (한 번에 5시간 반)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Seoul
        run: |
          publish() {
            cp index.html radar.html style.css site/
            (
              cd site
              rm -rf .git
              touch .nojekyll
              git init -q -b gh-pages
              git add -A
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "자료 $(date '+%Y-%m-%d %H:%M')"
              git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
            )
          }
          end=$(( $(date +%s) + 330 * 60 ))
          while :; do
            python collect.py --out site || echo "받기 실패 — 다음 회차에 다시"
            publish || echo "올리기 실패 — 다음 회차에 다시"
            [ $(( $(date +%s) + 30 * 60 )) -lt "$end" ] || break
            sleep $(( 30 * 60 ))
          done
